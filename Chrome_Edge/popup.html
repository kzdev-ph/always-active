<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 12px 14px; width: 200px; font: 13px system-ui, sans-serif; }
    label { display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-weight: 600; }
    input { width: 16px; height: 16px; cursor: pointer; }
    p { margin: 8px 0 0; color: #666; font-size: 11px; }
  </style>
</head>
<body>
  <label>Always Active <input type="checkbox" id="enabled"></label>
  <label style="margin-top:8px">Allow Copy <input type="checkbox" id="copy"></label>
  <p>Shortcut: Alt+Shift+A. Reload the game tab after turning off to fully restore normal behavior.</p>
  <script src="popup.js"></script>
</body>
</html>
